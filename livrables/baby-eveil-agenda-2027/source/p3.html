<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#fff}
.top{position:absolute;left:0;right:0;top:0;height:112px;background:var(--cream)}
.logo{position:absolute;left:22px;top:18px;width:250px}
.claim{position:absolute;left:296px;right:20px;top:22px}
.claim .k{font-size:10.5px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green-d)}
.claim h1{font-family:P;font-weight:800;font-size:22px;line-height:1.15;margin-top:6px;letter-spacing:-.2px}
.claim h1 .pill{background:var(--blue);font-size:22px}
.cities{position:absolute;left:22px;right:22px;top:130px;display:flex;flex-wrap:wrap;gap:8px 8px;justify-content:center}
.cities span{font-family:F;font-weight:700;font-size:15px;padding:3px 12px 5px;border-radius:20px;border:2px solid currentColor;display:flex;align-items:center;gap:5px}
.cities span svg{width:11px;height:14px}
.cities .main{background:var(--blue);border-color:var(--blue);color:#fff}
.foot{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:22px}
.foot .t{font-family:F;font-size:18px}
.foot .url{background:#fff;color:var(--green-d);padding:5px 14px 6px;border-radius:20px;font-size:14px}
</style></head><body><div class="ad">
<div class="top"></div>
<img class="logo" src="logo.png">
<div class="claim"><div class="k">1<sup>er</sup> réseau de crèches durables du Languedoc</div><h1>Une crèche près de chez vous, à <span class="pill">Montpellier</span> et alentours</h1></div>
<div class="cities" id="c"></div>
<div class="foot"><span class="t">Pré-inscription en ligne</span><span class="url">crechebabyeveil.fr</span></div>
</div><script>
const C=[['Montpellier','main'],['Lattes','#5E9A44'],['Jacou','#3E8FA8'],['Vendargues','#EB6A0A'],['Castelnau-le-Lez','#7B4FA0'],['Juvignac','#D9534F'],['Grabels','#5E9A44'],['Saint-Gély-du-Fesc','#3E8FA8'],['Saint-Clément-de-Rivière','#EB6A0A'],['Saint-Brès','#7B4FA0'],['Lauret','#C98A00']];
const pin='<svg viewBox="0 0 12 16"><path d="M6 0a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6zm0 8.3A2.3 2.3 0 1 1 6 3.7a2.3 2.3 0 0 1 0 4.6z" fill="currentColor"/></svg>';
document.getElementById('c').innerHTML=C.map(([n,c])=>c==='main'?`<span class="main">${pin}${n}</span>`:`<span style="color:${c}">${pin}${n}</span>`).join('');
</script></body></html>
