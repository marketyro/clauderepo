<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:var(--navy)}
.right{position:absolute;top:0;right:0;bottom:0;width:265px;background:var(--cream);clip-path:polygon(60px 0,100% 0,100% 100%,0 100%)}
.right .logo{position:absolute;left:76px;top:78px;width:178px}
.right .url{position:absolute;left:62px;right:14px;top:170px;text-align:center;font-size:15px;color:var(--orange)}
.right .hours{position:absolute;left:62px;right:14px;top:194px;text-align:center;font-size:9.5px;color:var(--navy);font-weight:600}
.left{position:absolute;left:30px;top:34px;width:440px;color:#fff}
.kicker{font-family:P;font-weight:700;font-size:10.5px;letter-spacing:2.2px;color:var(--yellow);text-transform:uppercase}
h1{font-family:P;font-weight:800;font-size:31px;line-height:1.12;margin-top:12px;letter-spacing:-.3px}
h1 .pill{background:var(--orange);font-size:33px;padding:0 12px 3px;border-radius:10px;margin-top:6px}
.sub{margin-top:18px;font-size:12.5px;line-height:1.45;color:#DCE3F0;max-width:390px}
.sub b{color:#fff;font-weight:700}
.ball{position:absolute;width:46px;left:430px;top:248px}
.stripe{position:absolute;left:30px;bottom:26px;display:flex;gap:6px}
.stripe i{display:block;width:34px;height:5px;border-radius:3px}
</style></head><body><div class="ad">
<div class="left">
  <div class="kicker">Crèches durables · Montpellier</div>
  <h1>Baby Éveil,<br>le partenaire crèche du <span class="pill">MHSC</span></h1>
  <p class="sub">Le <b>1<sup>er</sup> réseau de crèches durables du Languedoc</b> accueille vos enfants de 10 semaines à 3 ans, autour de Montpellier.</p>
</div>
<div class="stripe"><i style="background:var(--green)"></i><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--orange)"></i></div>
<img class="ball" src="ball.svg">
<div class="right"><img class="logo" src="logo.png"><div class="url">crechebabyeveil.fr</div><div class="hours">Du lundi au vendredi · 7h30 – 18h30</div></div>
</div></body></html>
