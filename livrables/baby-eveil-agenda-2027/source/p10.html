<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.head{position:absolute;left:24px;right:24px;top:14px;display:flex;align-items:center;justify-content:space-between}
.head h1{font-family:P;font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.2px;width:450px}
.head h1 .pill{background:var(--orange);font-size:21px}
.head img{height:66px}
.tiles{position:absolute;left:24px;right:24px;top:94px;height:164px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.tile{position:relative;border-radius:16px;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:10px;bottom:10px;font-family:F;font-size:15px;color:#fff;padding:2px 10px 4px;border-radius:9px}
.foot{position:absolute;left:24px;right:24px;bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.foot b{font-weight:700;color:var(--orange)}
.foot .url{font-size:14px;color:var(--green-d)}
.foot .btn{background:var(--green);color:#fff;font-family:F;font-size:13px;padding:4px 12px 6px;border-radius:10px}
</style></head><body><div class="ad">
<div class="head"><h1>Des crèches durables où bébé grandit <span class="pill">à son rythme</span></h1><img src="logo_baseline.png"></div>
<div class="tiles">
 <div class="tile"><img src="ph_jardin.jpg" style="object-position:45% 50%"><span style="background:var(--green)">Nature</span></div>
 <div class="tile"><img src="ph_sensoriel.jpg" style="object-position:62% 50%"><span style="background:#8B5CC2">Éveil des sens</span></div>
 <div class="tile"><img src="ph_maison.jpg" style="object-position:30% 45%"><span style="background:var(--blue)">Autonomie</span></div>
</div>
<div class="foot"><span>Partenaire crèche du <b>MHSC</b></span><span class="btn">Je réserve ma place en crèche</span><span class="url">crechebabyeveil.fr</span></div>
</div></body></html>
