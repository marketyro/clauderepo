<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url(fredoka.ttf);font-weight:700}
:root{--green:#8DC26F;--blue:#5FAEC4;--orange:#EB6A0A;--yellow:#FDBF31;--cream:#FFF9F2;--navy:#14213D}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1800px;height:90px;overflow:hidden;background:var(--cream)}
#root{position:relative;width:1800px;height:90px;overflow:hidden}
#brand{position:absolute;left:0;top:0;width:370px;height:90px;background:var(--cream);z-index:20;
  clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,0 100%);display:flex;align-items:center;gap:8px;padding-left:22px}
#brand .tree{height:84px}
#brand .word{height:50px}
#stage{position:absolute;left:300px;top:0;width:1500px;height:90px;overflow:hidden}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:24px;padding-left:70px}
.t{display:inline-block;white-space:nowrap;will-change:transform}
.h{font-family:F;font-weight:700;font-size:50px;color:#fff;line-height:1}
.pill{font-family:F;font-weight:700;font-size:48px;line-height:1;padding:8px 24px 10px;border-radius:18px;color:#fff}
.btn{font-family:F;font-weight:700;font-size:40px;line-height:1;padding:12px 30px 14px;border-radius:40px;background:var(--yellow);color:var(--orange);box-shadow:0 4px 0 rgba(0,0,0,.12)}
/* défilement des villes */
#cities{position:relative;height:66px;overflow:hidden;background:var(--blue);border-radius:18px}
#cities span{position:absolute;left:0;top:0;height:66px;line-height:62px;padding:0 24px;font-family:F;font-weight:700;font-size:44px;color:#fff;white-space:nowrap}
#ball{position:absolute;top:13px;width:64px;height:64px;z-index:15;left:-200px}
</style></head>
<body><div id="root">
  <div id="stage">
    <!-- S1 : crèches + villes -->
    <div class="scene" data-s="0" style="background:var(--green);justify-content:flex-start;padding-left:90px">
      <span class="t h" data-d="0" style="font-size:46px">Crèches durables à Montpellier et</span>
      <span class="t" data-d=".25" id="cities"></span>
    </div>
    <!-- S2 : places -->
    <div class="scene" data-s="11" style="background:var(--blue)">
      <span class="t h" data-d="0">Des places en crèche sont disponibles</span>
      <span class="t btn" data-d=".3" data-pulse="1">Pré-inscrivez-vous ›</span>
    </div>
    <!-- S3 : employeurs -->
    <div class="scene" data-s="17" style="background:var(--orange)">
      <span class="t h" data-d="0" style="font-size:46px">Employeurs : fidélisez vos talents</span>
      <span class="t pill" data-d=".3" style="background:var(--green);font-size:44px">grâce à nos crèches durables</span>
    </div>
    <!-- S4 : fin partenaire -->
    <div class="scene" data-s="23" style="background:var(--navy);gap:22px">
      <span class="t h" data-d="0" style="font-size:52px">Baby Éveil, partenaire du</span>
      <span class="t pill" data-d=".35" data-pulse="1" style="background:var(--orange);font-size:52px">MHSC</span>
      <span class="t h" data-d=".7" style="font-size:34px;color:var(--yellow);margin-left:28px">crechebabyeveil.fr</span>
    </div>
  </div>
  <svg id="ball" viewBox="-50 -50 100 100">
    <g id="ballg">
      <circle r="47" fill="#fff" stroke="#14213D" stroke-width="4"/>
      <polygon points="0,-16 15.2,-4.9 9.4,12.9 -9.4,12.9 -15.2,-4.9" fill="#14213D"/>
      <g fill="#14213D">
        <polygon points="0,-47 13,-40 9,-30 -9,-30 -13,-40" />
        <polygon points="44.7,-14.5 42,0 32,2 27,-14 35,-25" />
        <polygon points="27.6,38 15,44 8,36 18,24 30,26" />
        <polygon points="-27.6,38 -15,44 -8,36 -18,24 -30,26" />
        <polygon points="-44.7,-14.5 -42,0 -32,2 -27,-14 -35,-25" />
      </g>
      <g stroke="#14213D" stroke-width="3">
        <line x1="0" y1="-16" x2="0" y2="-30"/><line x1="15.2" y1="-4.9" x2="27" y2="-10"/>
        <line x1="9.4" y1="12.9" x2="17" y2="24"/><line x1="-9.4" y1="12.9" x2="-17" y2="24"/>
        <line x1="-15.2" y1="-4.9" x2="-27" y2="-10"/>
      </g>
    </g>
  </svg>
  <div id="brand"><img class="tree" src="tree.png"><img class="word" src="word.png"></div>
</div>
<script>
const STAGE_X=300, STAGE_W=1500, WIPE=0.7;
const CITIES=['Lattes','Jacou','Castelnau-le-Lez','Juvignac','Grabels','Saint-Gély-du-Fesc','Saint-Clément-de-Rivière','Saint-Brès','Lauret'];
const C_START=0.9, C_STEP=1.1, C_ANIM=0.4;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeIO=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const easeBack=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const box=document.getElementById('cities');
const spans=CITIES.map(c=>{const s=document.createElement('span');s.textContent=c;box.appendChild(s);return s});
let widths=null;
const scenes=[...document.querySelectorAll('.scene')].map(el=>({el,s:+el.dataset.s,items:[...el.querySelectorAll('.t')]}));
const ball=document.getElementById('ball'), ballg=document.getElementById('ballg');
function cityState(t){
  // index courant + progression de la transition vers le suivant
  const x=(t-C_START)/C_STEP; const i=Math.floor(x);
  if(i<0) return {i:0,p:0};
  if(i>=CITIES.length-1) return {i:CITIES.length-1,p:0};
  const p=easeIO(clamp(((x-i)*C_STEP-(C_STEP-C_ANIM))/C_ANIM));
  return {i,p};
}
window.setTime=function(t){
  if(!widths) widths=spans.map(s=>s.getBoundingClientRect().width);
  const {i,p}=cityState(t);
  box.style.width=(widths[i]+(widths[Math.min(i+1,CITIES.length-1)]-widths[i])*p)+'px';
  spans.forEach((s,k)=>{
    let y=100; if(k===i) y=-p*66; else if(k===i+1) y=(1-p)*66;
    s.style.transform=`translateY(${y}px)`;
  });
  let ballX=null;
  scenes.forEach((sc,n)=>{
    const pw = n===0 ? 1 : easeIO(clamp((t-sc.s)/WIPE));
    sc.el.style.zIndex=n+1;
    sc.el.style.visibility = t>=sc.s || n===0 ? 'visible':'hidden';
    sc.el.style.clipPath=`inset(0 ${(1-pw)*100}% 0 0)`;
    if(n>0 && pw>0 && pw<1) ballX=STAGE_X+pw*STAGE_W;
    const base = n===0 ? 0.15 : sc.s+WIPE*0.7;
    sc.items.forEach(it=>{
      const lt=t-base-(+it.dataset.d);
      const e=easeBack(clamp(lt/0.55));
      let z=1;
      if(it.dataset.pulse && lt>0.8) z=1+0.04*Math.sin((lt-0.8)*Math.PI*2/1.2);
      it.style.opacity=clamp(lt/0.2);
      it.style.transform=`translateY(${(1-e)*70}px) scale(${z})`;
    });
  });
  if(ballX!==null){
    ball.style.left=(ballX-32)+'px';
    ballg.setAttribute('transform',`rotate(${(ballX/32)*57.3})`);
  } else ball.style.left='-200px';
};
</script></body></html>
