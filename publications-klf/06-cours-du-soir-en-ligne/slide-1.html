<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Cours du soir – slide 1</title>
<link rel="stylesheet" href="../assets/klf.css"><link rel="stylesheet" href="../assets/lyon.css">
<style>
  .photo img { object-position: center 40%; }
  .hero-text { margin-top: auto; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-size: 104px; }
  .sched { display: flex; gap: 18px; }
  .box { flex: 1; background: rgba(255,255,255,0.10); border: 2px solid rgba(255,255,255,0.22); border-radius: 28px; padding: 26px 30px; }
  .box b { display: block; font-size: 36px; font-weight: 800; color: var(--yellow); line-height: 1; }
  .box span { display: block; font-size: 24px; font-weight: 500; margin-top: 10px; color: rgba(255,255,255,0.85); }
  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }

<body><div class="slide">
  <div class="photo"><img src="../assets/img/lyon-online-evening.jpg" alt=""></div>
  <div class="overlay"></div>
  <div class="pad">
    <div class="logo-row"><img class="logo" src="../assets/img/logo-lyon-white.png" alt="KLF Lyon"><span class="pill ghost">En ligne</span></div>
    <div class="hero-text">
      <span class="pill" style="align-self:flex-start">Cours du soir</span>

      <p class="sub">Deux cours en direct par semaine avec un professeur KLF Lyon, depuis chez vous. Pour les actifs, les étudiants et les agendas chargés.</p>
      <div class="sched">
        <div class="box"><b>Mar · Jeu</b><span>2 séances par semaine</span></div>
        <div class="box"><b>18h – 19h30</b><span>1h30 en direct</span></div>
        <div class="box"><b>A2 → C1</b><span>placement offert</span></div>
      </div>
      <div class="bottom"><span class="site">klf.fr/lyon</span><span class="pill blue">Glissez →</span></div>
    </div>
  </div>
