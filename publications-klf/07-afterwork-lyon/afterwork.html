<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Afterwork at KLF Lyon</title>
<link rel="stylesheet" href="../assets/klf.css">
<link rel="stylesheet" href="../assets/lyon.css">
<style>
  html, body { width: 1080px; height: 1080px; }
  .sq { position: relative; width: 1080px; height: 1080px; overflow: hidden; background: var(--navy); }
  .sq > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .badge { position: absolute; left: 86px; top: 102px; transform: rotate(-3deg); transform-origin: left top; display: flex; flex-direction: column; align-items: flex-start; filter: drop-shadow(0 14px 28px rgba(0,15,55,0.35)); }
  .l1 { background: var(--white); color: var(--navy); font-weight: 800; font-size: 72px; letter-spacing: 0.03em; text-transform: uppercase; padding: 14px 44px 12px; border-radius: 18px; line-height: 1.05; }
  .l2 { background: var(--navy); color: var(--white); font-weight: 800; font-size: 56px; letter-spacing: 0.04em; text-transform: uppercase; padding: 14px 36px 12px; border-radius: 16px; line-height: 1.05; margin-top: -8px; margin-left: -22px; }
  .l2 b { color: var(--pale); }
  .spark { position: absolute; width: 90px; height: 90px; }
  .spark svg { width: 100%; height: 100%; stroke: var(--pale); stroke-width: 9; stroke-linecap: round; fill: none; }
  .s1 { left: 486px; top: 58px; transform: rotate(10deg); }
  .s2 { left: 44px; top: 244px; transform: rotate(190deg); width: 70px; height: 70px; }
  .logo { position: absolute; right: 44px; bottom: 40px; height: 84px; filter: drop-shadow(0 6px 16px rgba(0,15,55,0.6)); }
</style>
</head>
<body>
<div class="sq">
  <img class="bg" src="bg.jpg" alt="">
  <div class="spark s1"><svg viewBox="0 0 100 100"><path d="M50 10v26M50 64v26M12 50h26M62 50h26"/></svg></div>
  <div class="badge">
    <div class="l1">Afterwork</div>
    <div class="l2">at <b>KLF Lyon</b></div>
  </div>
  <img class="logo" src="../assets/img/logo-lyon-white-mark.png" alt="KLF Lyon">
</div>
</body>
</html>
