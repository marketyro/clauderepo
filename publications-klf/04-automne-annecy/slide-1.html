<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Automne à Annecy – slide 1</title>
<link rel="stylesheet" href="../assets/klf.css">
<link rel="stylesheet" href="../assets/annecy.css">
<style>
  .photo img { object-position: center 40%; }
  .hero-text { margin-top: auto; display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 112px; }
  .cap { font-size: 72px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .cap .y { color: var(--yellow); }
  .en { font-size: 34px; font-weight: 500; color: rgba(255,255,255,0.85); line-height: 1.3; }
  .credit { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.55); margin-top: 10px; }
  .bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 30px; }

</style>
</head>
<body>
<div class="slide">
  <div class="photo"><img src="../assets/img/annecy-autumn-jardins-europe.jpg" alt=""></div>
  <div class="overlay"></div>
  <div class="pad">
    <div class="logo-row">
      <img class="logo" src="../assets/img/logo-annecy-white.png" alt="KLF Annecy">
      <span class="pill ghost">Octobre · Novembre</span>
    </div>
    <div class="hero-text">
      <span class="pill" style="align-self:flex-start">Carrousel photo</span>
      <h1>L'automne<br><span class="y">à Annecy.</span></h1>
      <p class="en">Autumn in Annecy: golden trees, a turquoise lake and the Alps on every corner. Your French classroom has a view.</p>
      <div class="bottom"><span class="credit">Photo : Guilhem Vellut · CC BY 2.0</span><span class="pill blue">Glissez →</span></div>
    </div>
  </div>
